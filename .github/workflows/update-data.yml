name: Daily Update
on:
  schedule:
    - cron: '0 18,22 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch data (with retries)
        run: |
          for i in 1 2 3; do
            echo "Fetch attempt $i"
            if node scripts/fetch-data.mjs; then
              exit 0
            fi
            sleep 60
          done
          exit 1
      - run: node scripts/predict.mjs
      - run: node scripts/backtest.mjs
      - run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add src/data/
          git commit -m "Daily data update $(date +%Y-%m-%d)" || true
          git push
